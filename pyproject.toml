[project]
name = "flet"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.85.1",
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.1",
    "flet-desktop>=0.85.1",
    "flet-web>=0.85.1",
]

[tool.flet]
desktop_flavor = "full"    # Change to "full" to use flet-audio and flet-video
org = "com.pixelreveal"
product = "pixelreveal"
company = "AnotherCyanFox"

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = true

[tool.flet.android.permission]
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true